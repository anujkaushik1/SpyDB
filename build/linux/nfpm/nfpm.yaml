# How SpyDB is packed for Linux (.deb for Ubuntu). The GitHub build
# (.github/workflows/release-linux.yml) sets VERSION from the release tag:
# v0.1.0 → 0.1.0. To pack it yourself on Linux: VERSION=0.1.0 wails3 package
name: "spydb"
arch: ${GOARCH}
platform: "linux"
version: "${VERSION}"
section: "devel"
priority: "optional"
maintainer: "Anuj Kaushik <anujkaushik1@users.noreply.github.com>"
description: "A fast, lightweight Postgres desktop client"
vendor: "Anuj Kaushik"
homepage: "https://github.com/anujkaushik1/SpyDB"
release: "1"

contents:
  - src: "./bin/spydb"
    dst: "/usr/bin/spydb"
  - src: "./build/appicon.png"
    dst: "/usr/share/pixmaps/spydb.png"
  - src: "./build/linux/spydb.desktop"
    dst: "/usr/share/applications/spydb.desktop"

# The window libraries SpyDB needs (GTK3 build): Ubuntu installs them with it.
# Ubuntu 24.04 renamed libgtk-3-0 to libgtk-3-0t64, so either one will do.
depends:
  - libgtk-3-0t64 | libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
